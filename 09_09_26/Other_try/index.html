<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lavishly+Yours&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Login_3.1</title>
</head>
<body>
    <div class="div-body">
        <div class="login-sec">
            <div class="text">
                <h1 id="titre">
                    Logo
                </h1>
                <h3 id="sous-titre1">
                    Let's get strarted
                </h3>
                <h6 class="sous-titre2">
                    By signing up, I agree to -buisiness name-'s 
                    <a href="#">Terms and Privacy policy</a>
                </h6>
            </div>
            <div>
                <button type="button" class="btn-sign">
                    <i class="fa-brands fa-google"></i>
                    Sign up with Google
                </button>
                <!-- Faire la barre "------ or  ------"  -->
            </div>
            <div class="inputs">
                <label for="email"></label>
                <input type="email" name="email" id="email" placeholder="Enter email address" required>

                <label for="name"></label>
                <input type="text" name="name" id="name" placeholder="Enter username" required>

                <label for="password"></label>
                <input type="password" name="password" id="password" placeholder="Enter password" required>

                <label for="confirm-P"></label>
                <input type="password" name="confirm-P" id="confirm-P" placeholder="Confirm password" required>
            </div>

            <div>
                <button type="button" class="btn-sign">
                    Sign Up
                </button>
            </div>

            <p class="sous-titre2">
                Already have account?
                <a href="#">Sign in</a>
            </p>
        </div>
        <div class="img-div">
            <img src="kawaii.png" alt="kawaii girl image">
        </div>
    </div>
</body>
</html>
