<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lavishly+Yours&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Login_4</title>
</head>
<body>
    <div class="div-body">
        <div class="img-div">
            <h2 class="logo">
                Logo
            </h2>
            <img src="back (1).jfif" alt="background">
        </div>
        <div class="login-sec">
            <div class="text">
                <h1>
                    Welcome
                </h1>
                <br>
                <h6>
                    Sign in to continue to your dashboard
                </h6>
            </div>
            <div class="card">
                <div class="inputs">
                    <div class="div-mail">
                        <label for="email"></label>
                        <input type="email" name="email" id="email" required placeholder="Email"> 
                        <i class="fa-regular fa-envelope"></i>
                    </div>

                    <div class="div-Pass">
                        <label for="password"></label>
                        <input type="password" name="password" id="password" required placeholder="Password">
                        <i class="fa-solid fa-unlock"></i> 
                    </div>
                </div>
                <div class="links">
                    <div class="div-check-box">
                        <input type="checkbox" name="remember" id="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#">Forgot password?</a>
                </div>
                <button type="button" class="btn-sign">Sign in</button>
                <!-- do ---- or continue with other -->
                <div class="icons-card">
                    <div class="google-card">
                        <i class="fa-brands fa-google"></i>
                    </div>
                    <div class="apple-card">
                        <i class="fa-brands fa-apple"></i>
                    </div>
                    <div class="git-card">
                        <i class="fa-brands fa-github"></i>
                    </div>
                </div>
            </div>
            <div class="create-account">
                <p>
                    New here? <a href="#">  Create an account</a>
                </p>
            </div>
        </div>
    </div> 
</body>
</html>
